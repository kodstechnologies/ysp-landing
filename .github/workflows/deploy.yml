name: Deploy YSP Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test SSH connectivity
        run: nc -vz ${{ secrets.EC2_HOST }} 22

      - name: Prepare target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/ysp-landing/dist
            rm -rf /home/ubuntu/ysp-landing/dist/*

      - name: Deploy build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/ysp-landing/dist"
          port: 22
          overwrite: true

      - name: Fix permissions & reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chmod o+x /home
            sudo chmod o+x /home/ubuntu
            sudo chmod -R o+rx /home/ubuntu/ysp-landing
            sudo chown -R www-data:www-data /home/ubuntu/ysp-landing
            sudo systemctl restart nginx

      - name: Deployment Complete
        run: echo "YSP Landing Page deployed successfully!"
