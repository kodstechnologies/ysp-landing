name: Deploy YSP Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node (REQUIRED for Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build project
      - name: Build project
        run: npm run build

      # 5. Verify build (IMPORTANT)
      - name: Verify build
        run: |
          ls -la dist
          test -f dist/index.html

      # 6. Clean old build on EC2
      - name: Clean old build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/ysp-landing/dist
            sudo rm -rf /home/ubuntu/ysp-landing/dist/*

      # 7. Upload new build DIRECTLY (NO MOVE)
      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/ysp-landing/dist/"
          overwrite: true

      # 8. Fix permissions + restart nginx
      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chown -R www-data:www-data /home/ubuntu/ysp-landing
            sudo chmod -R 755 /home/ubuntu/ysp-landing
            sudo chmod o+x /home
            sudo chmod o+x /home/ubuntu
            sudo systemctl restart nginx

      # 9. Done
      - name: Deployment Complete
        run: echo "✅ Deployment successful!"
