name: 🚀 Deploy Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: azureuser
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "📂 Moving to project folder..."
            cd /home/azureuser/ysp-landing

            echo "📥 Fetching latest code..."
            git fetch origin main

            echo "🔄 Resetting to latest main..."
            git reset --hard origin/main

            echo "🗑 Removing old build..."
            sudo rm -rf dist

            echo "📦 Installing dependencies..."
            npm install

            echo "🏗 Building project..."
            npm run build

            echo "📁 Checking dist folder..."
            ls -lah dist

            echo "🔐 Fixing permissions..."
            sudo chown -R www-data:www-data /home/azureuser/ysp-landing/dist
            sudo chmod 755 /home/azureuser
            sudo chmod 755 /home/azureuser/ysp-landing
            sudo chmod -R 755 /home/azureuser/ysp-landing/dist

            echo "🔄 Testing Nginx..."
            sudo nginx -t

            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "✅ Deployment complete!"
