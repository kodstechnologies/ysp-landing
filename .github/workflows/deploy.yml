name: Deploy YSP Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node (FIXED VERSION)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build project
      - name: Build project
        run: npm run build

      # 5. Verify build output (safety check)
      - name: Verify build
        run: |
          ls -la dist
          test -f dist/index.html

      # 6. Upload build to EC2 (CORRECT STRUCTURE)
      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist"
          target: "/home/ubuntu/"

      # 7. Deploy on EC2 (CLEAN + SAFE)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Remove old build
            sudo rm -rf /home/ubuntu/ysp-landing/dist

            # Move new build
            mv /home/ubuntu/dist /home/ubuntu/ysp-landing/

            # Fix permissions
            sudo chown -R www-data:www-data /home/ubuntu/ysp-landing
            sudo chmod -R 755 /home/ubuntu/ysp-landing
            sudo chmod o+x /home
            sudo chmod o+x /home/ubuntu

            # Restart nginx
            sudo systemctl restart nginx

      # 8. Done
      - name: Deployment Complete
        run: echo "✅ Deployment successful!"
