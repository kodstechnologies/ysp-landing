name: Deploy Shramik Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build the project
      - name: Build project
        run: npm run build

      # 5️⃣ Test SSH connectivity
      - name: Test SSH connectivity
        run: |
          echo "Testing SSH to EC2..."
          nc -vz ${{ secrets.EC2_HOST }} 22

      # 6️⃣ Deploy dist/ to EC2 via SCP
      - name: Deploy build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist/*"
          target: "/var/www/shramik-landing"
          port: 22
          timeout: 60s
          overwrite: true

      # 7️⃣ Fix permissions and reload Nginx
      - name: Fix permissions & reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "Setting permissions..."
            sudo chown -R www-data:www-data /var/www/shramik-landing
            sudo chmod -R 755 /var/www/shramik-landing
            echo "Reloading Nginx..."
            sudo systemctl reload nginx
