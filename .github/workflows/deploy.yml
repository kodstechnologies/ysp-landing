name: Deploy YSP Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test SSH connectivity
        run: nc -vz ${{ secrets.EC2_HOST }} 22

      - name: Clean & prepare target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo rm -rf /var/www/ysp-landing/*
            sudo mkdir -p /var/www/ysp-landing
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /var/www/ysp-landing
            sudo chmod -R 755 /var/www/ysp-landing

      - name: Deploy build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist/*"
          target: "/var/www/ysp-landing"
          port: 22
          overwrite: true
          timeout: 60s

      - name: Fix permissions & reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/ysp-landing
            sudo chmod -R 755 /var/www/ysp-landing
            sudo systemctl reload nginx

      - name: Deployment Complete
        run: echo "YSP Landing Page deployed successfully!"
