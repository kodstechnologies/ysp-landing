name: Deploy YSP Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build project
      - name: Build project
        run: npm run build

      # 5. Verify build (IMPORTANT)
      - name: Verify build output
        run: |
          ls -la dist
          test -f dist/index.html

      # 6. Deploy to EC2 (single SSH step - BEST PRACTICE)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Create temp folder
            mkdir -p /home/ubuntu/tmp-deploy

      # 7. Copy files to temp folder
      - name: Upload files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/tmp-deploy"
          overwrite: true

      # 8. Move files safely (ZERO ERROR STEP)
      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Clean old build safely
            sudo rm -rf /home/ubuntu/ysp-landing/dist
            mkdir -p /home/ubuntu/ysp-landing/dist

            # Move new build
            mv /home/ubuntu/tmp-deploy/dist/* /home/ubuntu/ysp-landing/dist/

            # Remove temp
            rm -rf /home/ubuntu/tmp-deploy

            # Fix permissions (CRITICAL)
            sudo chown -R www-data:www-data /home/ubuntu/ysp-landing
            sudo chmod -R 755 /home/ubuntu/ysp-landing
            sudo chmod o+x /home
            sudo chmod o+x /home/ubuntu

            # Restart nginx
            sudo systemctl restart nginx

      # 9. Done
      - name: Deployment Complete
        run: echo "✅ Deployment successful!"
